# Render Blueprint for the FG Testing Tracker (free plan + free Neon database).
# Optional: only used if you create the app with New > Blueprint.
# If you created a Web Service by hand, Render ignores this file.
services:
  - type: web
    name: fg-testing-tracker
    runtime: python
    plan: free
    region: singapore         # closest Render region to India; pick the same region in Neon
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL        # connection string from Neon (see DEPLOY_RENDER.md)
        sync: false
      - key: FGT_TEAM_PASSWORD   # everyone signs in with this
        sync: false
      - key: FGT_ADMIN_PASSWORD  # opens Test schedule and Settings
        sync: false
      - key: FGT_SECRET_KEY
        generateValue: true
